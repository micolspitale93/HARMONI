name: unit-tests

# Unit tests of core/, ros2/ and ros1/: no ROS and no docker image needed.
on:
  push:
    branches: [develop, dev/harmoni2.0, dev/ros2]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12: ROS 2 Jazzy (Ubuntu 24.04); 3.8: ROS 1 Noetic (Ubuntu 20.04)
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install pytest "py_trees>=2.2,<2.4" pyyaml python-dotenv
      - name: Validate the tree files
        run: |
          for tree in core/trees/*.json; do PYTHONPATH=core python -m harmoni.tree validate "$tree"; done
      - name: Run unit tests
        run: ./harmoni.sh test

  studio-e2e:
    # HARMONI Studio in a real browser: compose, simulate, services, modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install requirements
        run: |
          python -m pip install pytest "py_trees>=2.2,<2.4" pyyaml python-dotenv
          npm install -g playwright@1.49.1
          npx playwright@1.49.1 install --with-deps chromium
      - name: Run the Studio end-to-end test
        run: core/tests/e2e/run_studio_e2e.sh "$PWD/studio-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots
          path: studio-screenshots
