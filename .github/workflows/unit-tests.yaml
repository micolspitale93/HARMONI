name: unit-tests

# ROS-free unit tests (see conftest.py and run_tests.sh). Fast: no docker image is built.
on:
  push:
    branches: [develop, dev/harmoni2.0]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test requirements
        run: python -m pip install pytest py_trees python-dotenv
      - name: Run unit tests
        run: ./run_tests.sh unit
