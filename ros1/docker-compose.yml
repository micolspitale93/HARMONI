# HARMONI complete setup: all the noetic containers (about 20 GB of images).
#
# Start with:   ./harmoni.sh ros1 up full      (or, from ros1/: docker compose -f docker-compose.yml up -d)
# Open a shell: ./harmoni.sh ros1 shell harmoni_full
#
# The ros1/ folder of your local clone is mounted inside every container at
# /root/harmoni_catkin_ws/src/HARMONI, so edits on the host are immediately visible
# in the containers. Credentials are read from the .env file in the repository root
# (see .env.example), ~/.aws and ~/.gcp.

x-harmoni-common: &harmoni-common
  init: true
  privileged: true
  working_dir: /root/harmoni_catkin_ws/src/HARMONI
  command: tail -f /dev/null
  env_file:
    - path: ../.env
      required: false
  volumes: &harmoni-volumes
    - ./:/root/harmoni_catkin_ws/src/HARMONI/
    # Configuration / credentials
    - ${HOME}/.aws:/root/.aws/
    - ${HOME}/.gcp/private-keys.json:/root/.gcp/private-keys.json
    # Display and time
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro

x-harmoni-env: &harmoni-env
  DISPLAY: ${DISPLAY:-:0}
  QT_GRAPHICSSYSTEM: native
  ROS_DISTRO: noetic
  IS_DOCKER_ENV: "true"
  CATKIN_WS: harmoni_catkin_ws
  ROS_MASTER_URI: http://172.18.3.4:11311

services:
  harmoni_full:
    <<: *harmoni-common
    container_name: harmoni_full
    hostname: harmoni_full
    image: harmoni02/harmoni2.0:full
    build:
      context: .
      dockerfile: dockerfiles/harmoni/noetic/full/dockerfile
      network: host
    environment:
      <<: *harmoni-env
      ROS_HOSTNAME: harmoni_full
    networks:
      ros_net:
        ipv4_address: 172.18.3.4
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
      - /dev/video0:/dev/video0
    ports:
      - "11312:11312"
      - "33691:33691"
      - "8081:8081"

  harmoni_hardware:
    <<: *harmoni-common
    container_name: harmoni_hardware
    hostname: ros_hardware
    image: harmoni02/harmoni2.0:full
    build:
      context: .
      dockerfile: dockerfiles/harmoni/noetic/full/dockerfile
      network: host
    environment:
      <<: *harmoni-env
      ROS_HOSTNAME: harmoni_hardware
    networks:
      ros_net:
        ipv4_address: 172.18.3.5
    depends_on:
      - harmoni_full
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
      - /dev/video0:/dev/video0

  harmoni_face_detector:
    <<: *harmoni-common
    container_name: harmoni_face_detector
    hostname: harmoni_face_detector
    image: harmoni02/harmoni2.0:face_detect
    build:
      context: .
      dockerfile: dockerfiles/harmoni/noetic/face_detect/dockerfile
      network: host
    environment:
      <<: *harmoni-env
      ROS_HOSTNAME: harmoni_face_detector
    networks:
      ros_net:
        ipv4_address: 172.18.3.2
    depends_on:
      - harmoni_full
      - harmoni_hardware
    devices:
      - /dev/dri:/dev/dri
      - /dev/video0:/dev/video0

  harmoni_imageai:
    <<: *harmoni-common
    container_name: harmoni_imageai
    hostname: harmoni_imageai
    image: harmoni02/harmoni2.0:imageai
    build:
      context: .
      dockerfile: dockerfiles/harmoni/noetic/imageai/dockerfile
      network: host
    environment:
      <<: *harmoni-env
      ROS_HOSTNAME: harmoni_imageai
    networks:
      ros_net:
        ipv4_address: 172.18.3.8
    depends_on:
      - harmoni_full
      - harmoni_hardware
    devices:
      - /dev/dri:/dev/dri
      - /dev/video0:/dev/video0

  harmoni_fer:
    <<: *harmoni-common
    container_name: harmoni_fer
    hostname: harmoni_fer
    image: harmoni02/harmoni2.0:fer
    build:
      context: .
      dockerfile: dockerfiles/harmoni/noetic/fer/dockerfile
      network: host
    environment:
      <<: *harmoni-env
      ROS_HOSTNAME: harmoni_fer
    networks:
      ros_net:
        ipv4_address: 172.18.3.6
    depends_on:
      - harmoni_full
      - harmoni_hardware
    devices:
      - /dev/dri:/dev/dri
      - /dev/video0:/dev/video0

  harmoni_detectors:
    <<: *harmoni-common
    container_name: harmoni_detectors
    hostname: harmoni_detectors
    image: harmoni02/harmoni2.0:detectors
    build:
      context: .
      dockerfile: dockerfiles/harmoni/noetic/detectors/dockerfile
      network: host
    environment:
      <<: *harmoni-env
      ROS_HOSTNAME: harmoni_detectors
    networks:
      ros_net:
        ipv4_address: 172.18.3.7
    depends_on:
      - harmoni_full
      - harmoni_hardware
    devices:
      - /dev/dri:/dev/dri
      - /dev/video0:/dev/video0

networks:
  ros_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.3.0/24
