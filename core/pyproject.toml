[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harmoni-core"
version = "2.0.0"
description = "ROS-independent core of HARMONI: behavior tree format, runner, leaves and service backends"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["py_trees>=2.2", "pyyaml"]

[project.optional-dependencies]
assistant = ["openai>=1.0", "python-dotenv"]
azure = ["azure-cognitiveservices-speech", "python-dotenv"]
furhat = ["furhat-remote-api"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["harmoni*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
