# Services used to simulate the group interaction without robots, ROS or cloud credentials:
#   python -m harmoni.tree simulate trees/group_interaction.json --services trees/group_interaction.mock.yaml
services:
  stt_default:
    backend: mock
    responses:
      - "Micol: Hi, I am Micol, nice to meet you"
      - "Micol: I think the large room should cost more"
      - "Micol: But I cannot afford more than 700"
      - "Micol: Ok, let us split it 800, 650, 550"
  bot_default:
    backend: mock
    responses:
      - '{"intervene": true, "agent": "Opposer", "response": "Is that fair for the one without a window?", "addressee": "Micol"}'
      - '{"intervene": false, "agent": "Mover", "response": "", "addressee": ""}'
      - '{"intervene": true, "agent": "Mover", "response": "What would a fair split look like to you?", "addressee": "Micol"}'
  speaker_furhat: {backend: furhat, mockup: true}
  speaker_nao: {backend: nao_http, mockup: true}
  led_furhat: {backend: furhat_led, mockup: true}
  led_nao: {backend: nao_led_http, mockup: true}
