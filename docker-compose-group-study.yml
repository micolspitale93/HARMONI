services:
  harmoni_full:
    container_name: harmoni_full_group
    build:
      context: .
      dockerfile: dockerfiles/harmoni/noetic/full/dockerfile
      network: host
    image: harmoni02/harmoni2.0:full
    init: true
    environment:
      DISPLAY: $DISPLAY
      QT_GRAPHICSSYSTEM: native
      ROS_DISTRO: noetic
      IS_DOCKER_ENV: "true"
      CATKIN_WS: harmoni_catkin_ws
    privileged: true
    network_mode: "host"
    ports:
      - "11312:11312"
      - "33691:33691"
      - "8081:8081"
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
      - /dev/video0:/dev/video0
    volumes:
      - ../HARMONI/:/root/local_mount/HARMONI/
      # Configuration
      - ~/.aws:/root/.aws/
      - ~/.gcp/private-keys.json:/root/.gcp/private-keys.json
      # Other
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    working_dir: /root/harmoni_catkin_ws/src/HARMONI
    command: tail  -f /dev/null

  harmoni_nao:
    container_name: harmoni_nao
    build:
      context: .
      dockerfile: dockerfiles/harmoni/kinetic/nao/dockerfile
      network: host
    init: true
    environment:
      DISPLAY: $DISPLAY
      QT_GRAPHICSSYSTEM: native
      ROS_DISTRO: kinetic
      IS_DOCKER_ENV: "true"
      CATKIN_WS: harmoni_catkin_ws
    privileged: true
    network_mode: "host"
    depends_on:
      - "harmoni_full"
    volumes:
      - ../HARMONI/:/nao/local_mount/HARMONI/
      # Other
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    working_dir: /nao/harmoni_catkin_ws/src/HARMONI
    command: tail  -f /dev/null


networks:
  host:
    driver: bridge
    
